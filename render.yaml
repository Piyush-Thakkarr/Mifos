services:
  # Django Backend Service
  - type: web
    name: client-portal-backend
    env: python
    plan: free
    buildCommand: |
      cd portal_backend &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: |
      cd portal_backend &&
      gunicorn portal_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: MIFOS_BASE_URL
        sync: false
      - key: MIFOS_TENANT_ID
        value: default
      - key: MIFOS_ADMIN_USER
        sync: false
      - key: MIFOS_ADMIN_PASS
        sync: false
      - key: MIFOS_VERIFY_SSL
        value: true
      - key: MIFOS_CLIENT_ID
        value: 3
      - key: FRONTEND_URL
        fromService:
          type: web
          name: client-portal-frontend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: client-portal-frontend
          property: host

  # Angular Frontend Service
  - type: web
    name: client-portal-frontend
    env: node
    plan: free
    dockerfilePath: ""
    buildCommand: |
      chmod +x build-frontend.sh &&
      ./build-frontend.sh
    startCommand: npx serve -s dist/web-app/browser -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DJANGO_API_URL
        fromService:
          type: web
          name: client-portal-backend
          property: host
      - key: FINERACT_API_URL
        sync: false
      - key: FINERACT_PLATFORM_TENANT_IDENTIFIER
        value: default

