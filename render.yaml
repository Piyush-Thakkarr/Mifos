services:
  # PostgreSQL Database for Fineract
  - type: pspg
    name: fineract-database
    plan: free
    databaseName: fineract_tenants
    user: fineract_user

  # Fineract Backend Service (Docker)
  - type: web
    name: fineract-backend
    plan: starter
    dockerfilePath: ./fineract/Dockerfile
    dockerContext: ./fineract
    dockerCommand: |
      docker run -d \
        -p $PORT:8443 \
        -e FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.postgresql.Driver \
        -e FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME} \
        -e FINERACT_HIKARI_USERNAME=${DATABASE_USER} \
        -e FINERACT_HIKARI_PASSWORD=${DATABASE_PASSWORD} \
        -e FINERACT_DEFAULT_TENANTDB_HOST=${DATABASE_HOST} \
        -e FINERACT_DEFAULT_TENANTDB_PORT=${DATABASE_PORT} \
        -e FINERACT_DEFAULT_TENANTDB_UID=${DATABASE_USER} \
        -e FINERACT_DEFAULT_TENANTDB_PWD=${DATABASE_PASSWORD} \
        -e FINERACT_DEFAULT_TENANTDB_NAME=fineract_default \
        apache/fineract:latest
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: fineract-database
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: fineract-database
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: fineract-database
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: fineract-database
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fineract-database
          property: password

  # Django Backend Service
  - type: web
    name: client-portal-backend
    env: python
    plan: free
    buildCommand: |
      cd portal_backend &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: |
      cd portal_backend &&
      gunicorn portal_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      # Fineract Configuration - points to deployed Fineract service
      - key: MIFOS_BASE_URL
        fromService:
          type: web
          name: fineract-backend
          property: host
        value: https://fineract-backend.onrender.com/fineract-provider/api/v1
      - key: MIFOS_TENANT_ID
        value: default
      - key: MIFOS_ADMIN_USER
        sync: false
      - key: MIFOS_ADMIN_PASS
        sync: false
      - key: MIFOS_VERIFY_SSL
        value: false
      - key: MIFOS_CLIENT_ID
        value: 3
      # Frontend URL for CORS
      - key: FRONTEND_URL
        fromService:
          type: web
          name: client-portal-frontend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: client-portal-frontend
          property: host
      # Database (optional - uses SQLite if not set)
      - key: DATABASE_URL
        fromDatabase:
          name: fineract-database
          property: connectionString

  # Angular Frontend Service
  - type: web
    name: client-portal-frontend
    env: node
    plan: free
    buildCommand: |
      chmod +x build-frontend.sh &&
      ./build-frontend.sh
    startCommand: npx serve -s dist/web-app/browser -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # Django Backend URL
      - key: DJANGO_API_URL
        fromService:
          type: web
          name: client-portal-backend
          property: host
      # Fineract API URL (for main Mifos app, not client portal)
      - key: FINERACT_API_URL
        fromService:
          type: web
          name: fineract-backend
          property: host
      - key: FINERACT_PLATFORM_TENANT_IDENTIFIER
        value: default
